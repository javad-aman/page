services:
  db:
    image: postgres:16
    container_name: page-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume (lives inside WSL2): much faster than a Windows bind mount.
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g
    # Tuned for bulk loading on a dev machine (adjust to your RAM).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - work_mem=64MB
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - synchronous_commit=off
      - -c
      - max_parallel_maintenance_workers=4

volumes:
  pgdata:
